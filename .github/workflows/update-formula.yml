name: Update formula

# Checks bpeers01/tkr-releases' latest release against the version pinned
# in Formula/tkr.rb and opens a PR here with the bump when it drifts.
#
# This is a same-repo scheduled check, not a cross-repo dispatch, on
# purpose: wiring tkr-releases' own release workflow to fire a
# repository_dispatch into this tap would need a PAT secret configured on
# that repo (bpeers01/tkr-releases is locked down — see that repo's own
# release automation) that this workflow doesn't have access to configure.
# A daily poll of the public releases API needs no secret at all and can't
# silently stop working if a cross-repo token is later rotated or scoped
# down without this repo being told.
on:
  schedule:
    - cron: '17 6 * * *' # daily, off the hour to avoid GitHub's scheduling pile-up
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false is load-bearing, not hygiene. checkout v7
      # persists auth two ways at once — `http.extraheader` *and* an
      # `includeIf.gitdir` credentials config — and create-pull-request adds
      # its own extraheader from `token:` on top. Both reach the push, GitHub
      # rejects it with `remote: Duplicate header: "Authorization"` / HTTP 400,
      # and the job dies at the Open PR step *after* the formula was correctly
      # rewritten, so the logs read like a successful bump right up to the
      # last line. No step between here and Open PR touches git, so dropping
      # the persisted credentials costs nothing; create-pull-request
      # authenticates from its own `token:` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch latest tkr-releases release
        id: latest
        run: |
          set -euo pipefail
          latest_json=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bpeers01/tkr-releases/releases/latest)
          tag=$(echo "$latest_json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).tag_name")
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare against pinned formula version
        id: compare
        run: |
          set -euo pipefail
          # Read the pinned version from a download URL, not a `version` line:
          # `brew audit` rejects an explicit `version` as redundant when it can
          # be scanned from the URL, so the URL is now the only place it lives.
          pinned=$(grep -oP '(?<=/download/v)[^/]+' Formula/tkr.rb | head -1)
          if [ -z "$pinned" ]; then
            echo "::error::could not read pinned version from Formula/tkr.rb — refusing to continue"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "${{ steps.latest.outputs.version }}" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download checksums for latest release
        if: steps.compare.outputs.stale == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.latest.outputs.tag }}"
          # Download outside the checkout. Anything written into the repo
          # working dir gets staged by create-pull-request, which is how the
          # v5.23.0 bump PR ended up also adding checksums.sha256 to the tap.
          curl -fsSL -o "$RUNNER_TEMP/checksums.sha256" \
            "https://github.com/bpeers01/tkr-releases/releases/download/${tag}/checksums.sha256"
          cat "$RUNNER_TEMP/checksums.sha256"

      - name: Bump formula
        if: steps.compare.outputs.stale == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.latest.outputs.tag }}"
          version="${{ steps.latest.outputs.version }}"

          sha_darwin_arm64=$(grep 'tkr-darwin-arm64$' "$RUNNER_TEMP/checksums.sha256" | awk '{print $1}')
          sha_darwin_amd64=$(grep 'tkr-darwin-amd64$' "$RUNNER_TEMP/checksums.sha256" | awk '{print $1}')
          sha_linux_amd64=$(grep 'tkr-linux-amd64$' "$RUNNER_TEMP/checksums.sha256" | awk '{print $1}')

          if [ -z "$sha_darwin_arm64" ] || [ -z "$sha_darwin_amd64" ] || [ -z "$sha_linux_amd64" ]; then
            echo "::error::missing one or more expected checksum entries for $tag — refusing to bump"
            exit 1
          fi

          sed -i \
            -e "s#download/v[0-9][^/]*/tkr-darwin-arm64\"#download/${tag}/tkr-darwin-arm64\"#" \
            -e "s#download/v[0-9][^/]*/tkr-darwin-amd64\"#download/${tag}/tkr-darwin-amd64\"#" \
            -e "s#download/v[0-9][^/]*/tkr-linux-amd64\"#download/${tag}/tkr-linux-amd64\"#" \
            Formula/tkr.rb

          # Replace each sha256 line by position: arm64 block, then intel, then
          # linux. Positional rather than block-name-driven on purpose — the
          # Linux block nests its url/sha256 inside `on_intel` (brew audit
          # rejects them bare under `on_linux`), so an `/on_intel do/` state
          # rule matches twice and would write the darwin-amd64 checksum into
          # the Linux block.
          sha_count=$(grep -c 'sha256 "' Formula/tkr.rb)
          if [ "$sha_count" -ne 3 ]; then
            echo "::error::expected 3 sha256 lines in Formula/tkr.rb, found ${sha_count} — refusing to bump"
            exit 1
          fi

          awk -v arm="$sha_darwin_arm64" -v intel="$sha_darwin_amd64" -v linux="$sha_linux_amd64" '
            /sha256 "/ {
              n++
              if (n == 1)      sub(/sha256 ".*"/, "sha256 \"" arm "\"")
              else if (n == 2) sub(/sha256 ".*"/, "sha256 \"" intel "\"")
              else if (n == 3) sub(/sha256 ".*"/, "sha256 \"" linux "\"")
            }
            { print }
          ' Formula/tkr.rb > Formula/tkr.rb.new
          mv Formula/tkr.rb.new Formula/tkr.rb

          cat Formula/tkr.rb

      - name: Open PR
        if: steps.compare.outputs.stale == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump tkr formula to ${{ steps.latest.outputs.tag }}"
          title: "chore: bump tkr formula to ${{ steps.latest.outputs.tag }}"
          body: |
            Automated bump: `Formula/tkr.rb` was pinned to
            `${{ steps.compare.outputs.pinned }}`, latest tkr-releases
            release is `${{ steps.latest.outputs.tag }}`.

            sha256 values pulled from that release's `checksums.sha256`.

            Review before merging — this workflow does not auto-merge.
          branch: bump-formula-${{ steps.latest.outputs.tag }}
          delete-branch: true
